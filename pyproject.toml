[project]
name = "transforge"
version = "0.2.0"
description = "Config-driven website translator running against a local LLM server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
transforge = "transforge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["transforge", "review"]

[tool.uv]
# uv caches the built wheel of this project and, by default, only invalidates
# it when pyproject.toml / setup.py / setup.cfg change. The Dockerfile keeps
# that cache in a persistent build mount, so without these keys an image
# rebuilt after a source-only change (same version) shipped the OLD code.
cache-keys = [{ file = "pyproject.toml" }, { file = "transforge.py" }, { file = "review.py" }]
